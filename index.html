<!DOCTYPE html>

        <!-- Dan Selector -->
        <div class="bg-white border-4 border-slate-200 rounded-game-md p-4 px-5 shadow-[0_8px_18px_rgba(0,0,0,0.04)]">
          <h2 class="font-title font-normal text-[1.55rem] text-slate-700 mb-3 flex items-center gap-2">⭐ 1. 학습할 곱셈 단을 눌러보세요!</h2>

            <button class="dan-btn font-title font-normal text-[1.4rem] py-3.5 px-2 rounded-game-sm cursor-pointer transition-all duration-250 ease-[cubic-bezier(0.175,0.885,0.32,1.275)] flex items-center justify-center gap-1 hover:-translate-y-1 hover:rotate-[-2deg] hover:scale-105 bg-teal-100 border-[3.5px] border-teal-300 text-slate-700 shadow-[0_5px_0_#14b8a6] [&.active]:!bg-gradient-to-br [&.active]:!from-indigo-400 [&.active]:!to-indigo-600 [&.active]:!border-indigo-800 [&.active]:!text-white [&.active]:!shadow-[0_5px_0_#312e81] [&.active]:!scale-[1.06] [&.active]:after:content-['_✨']" data-dan="6">6단 🎲</button>

            <button class="dan-btn font-title font-normal text-[1.4rem] py-3.5 px-2 rounded-game-sm cursor-pointer transition-all duration-250 ease-[cubic-bezier(0.175,0.885,0.32,1.275)] flex items-center justify-center gap-1 hover:-translate-y-1 hover:rotate-[-2deg] hover:scale-105 bg-indigo-100 border-[3.5px] border-indigo-300 text-slate-700 shadow-[0_5px_0_#818cf8] [&.active]:!bg-gradient-to-br [&.active]:!from-indigo-400 [&.active]:!to-indigo-600 [&.active]:!border-indigo-800 [&.active]:!text-white [&.active]:!shadow-[0_5px_0_#312e81] [&.active]:!scale-[1.06] [&.active]:after:content-['_✨']" data-dan="8">8단 🐙</button>

            <div class="game-mode-card active group bg-yellow-50 border-[3.5px] border-yellow-200 rounded-game-md p-4 px-2.5 flex flex-col items-center text-center cursor-pointer transition-all duration-250 ease-[cubic-bezier(0.175,0.885,0.32,1.275)] shadow-[0_6px_0_#fde047] hover:-translate-y-1.5 hover:rotate-[-1deg] hover:scale-[1.03] hover:bg-yellow-100 [&.active]:!bg-gradient-to-br [&.active]:!from-violet-400 [&.active]:!to-violet-500 [&.active]:!border-violet-700 [&.active]:!text-white [&.active]:!shadow-[0_6px_0_#5b21b6] [&.active]:!scale-[1.04]" data-mode="1">
